<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold Your Breath — Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;800&family=Barlow+Condensed:wght@500;600;700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="lib/game.css">
<script src="vendor/rough.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font: 800 30px/1 var(--display); color: var(--hi); margin: 0; }
  .kick { font: 600 13px var(--label); letter-spacing: .18em; color: var(--accent2); text-transform: uppercase; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { font: 600 14px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); text-decoration: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
  nav a[aria-current="page"] { color: #002a22; background: var(--accent2); border-color: var(--accent2); }
  .stage-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
  .stage-wrap canvas { width: 100%; height: 100%; display: block; }
  .world { position: absolute; inset: 0; background: url('assets/img/watcher-earthset-limb.jpg') center 40% / cover; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { font: 700 14px var(--label); letter-spacing: .1em; text-transform: uppercase; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--hi); cursor: pointer; }
  .look-up { margin-top: 10px; }
  .note { color: var(--dim); font-size: 13px; margin: 10px 0 0; }
  .log { font: 13px var(--mono); color: var(--dim); margin-top: 12px; min-height: 1.5em; }
  .fallback { position: absolute; inset: 0; background: url('assets/img/watcher-earthset-orion.jpg') center / cover; }
  .nb { padding: 26px 30px; border-radius: 4px; }
  .nb h2 { font: 700 38px/1 'Caveat', cursive; margin: 0 0 16px; }
  .nb .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .nb figure { margin: 0; } .nb figure img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .nb figcaption { font: 700 20px 'Caveat', cursive; margin-top: 6px; }
  .nb .plan { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: center; margin-top: 26px; }
  .nb .plan .btn { background: #fff8ea; color: #2d2c2a; border-color: #8a8272; }
  @media (max-width: 800px) { .nb .shots, .nb .plan { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kick">Pre-build · test bench · story v4</div><h1>Prototypes</h1></div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
  <p class="log" id="log"></p>
</div>

<script type="module">
  import { CONTENT } from './content.js';
  import { mountInteraction } from './lib/interactions.js';
  import { mountHud } from './lib/hud.js';
  import { ensurePencil, drawPlan, PLAN_NAMES } from './lib/notebook.js';
  import { mountSalvageMap } from './lib/archive-map.js';

  const P = [['stage', '3D stage'], ['notebook', 'Notebook'], ['map', 'Salvage map'], ...CONTENT.crises.map(c => [c.id, `${c.name} · ${c.interaction.verb}`])];
  const q = new URLSearchParams(location.search), cur = q.get('p') || 'stage';
  const $ = s => document.querySelector(s), main = $('#main'), log = m => $('#log').textContent = m;
  const keep = ['speed', 'timer'].filter(k => q.get(k)).map(k => `&${k}=${q.get(k)}`).join('');
  $('#nav').innerHTML = P.map(([id, name]) => `<a href="?p=${id}${keep}" ${id === cur ? 'aria-current="page"' : ''}>${name}</a>`).join('');

  if (cur === 'stage') {
    main.innerHTML = `<div class="stage-wrap"><canvas id="c"></canvas></div><div class="row" id="wps"></div>
      <p class="note">Each button flies the camera to a crisis waypoint from content.js. ?speed=4 fast-forwards.</p>`;
    const { createStage } = await import('./lib/stage3d.js');
    const stage = createStage($('#c'), { moon: 'assets/textures/moon_4k.jpg', earth: 'assets/textures/earth_day.jpg', stars: 'assets/textures/stars_milky_way.jpg' });
    if (!stage) { $('.stage-wrap').innerHTML = '<div class="fallback"></div>'; log('WebGL unavailable: kill switch → still image.'); }
    else {
      const WPS = [['Title', { lat: 10, lon: -35, alt: 3.4, sunLon: 60 }], ...CONTENT.crises.map(c => [c.name, c.waypoint])];
      $('#wps').innerHTML = WPS.map(([n], i) => `<button class="btn" data-i="${i}">${n}</button>`).join('');
      stage.snap(WPS[0][1]);
      $('#wps').addEventListener('click', async e => { const i = e.target.dataset.i; if (i == null) return; log('Flying to ' + WPS[i][0] + '…'); await stage.flyTo(WPS[i][1], 3); log('Arrived: ' + WPS[i][0]); });
      window.__stage = stage;
    }

  } else if (cur === 'notebook') {
    ensurePencil();
    main.innerHTML = `<div class="nb paper">
      <h2>Bhoomi’s notebook</h2>
      <div class="shots">
        <figure class="taped"><img class="sketch" src="assets/img/sketch-houbolt-lor.jpg" alt="John Houbolt at his chalkboard, 1962"><figcaption>Houbolt, 1962: “leave the big ship in orbit”</figcaption></figure>
        <figure class="taped" style="rotate:1deg"><img class="sketch" src="assets/img/air-co2-mailbox.jpg" alt="Apollo 13 CO2 adapter"><figcaption>Apollo 13’s mailbox, 1970</figcaption></figure>
        <figure class="taped"><img class="sketch" src="assets/img/sketch-apollo12-rtg.jpg" alt="Alan Bean unloading the RTG fuel element"><figcaption>Apollo 12’s nuclear battery. Still warm?</figcaption></figure>
      </div>
      <div class="plan"><svg class="plan-svg" id="plan" role="img" aria-label="Bhoomi's hand-drawn plan"></svg>
        <div><div class="hand" style="font-size:24px" id="plan-name"></div><div class="row" id="plans"></div></div></div></div>`;
    const show = n => { $('#plan-name').textContent = 'PLAN: ' + n.replace('-', ' '); drawPlan($('#plan'), n); };
    $('#plans').innerHTML = PLAN_NAMES.map(n => `<button class="btn" data-n="${n}">${n}</button>`).join('');
    $('#plans').addEventListener('click', e => e.target.dataset.n && show(e.target.dataset.n));
    show(q.get('plan') || 'scrubber-adapter');

  } else if (cur === 'map') {
    const missions = await (await fetch('data/missions.json')).json();
    mountSalvageMap(main, { ...CONTENT.salvageMap, missions, moonTexture: 'assets/textures/moon_2k.jpg', earthTexture: 'assets/textures/earth_day.jpg', onDone: () => log('Lifted into the visor view: salvage sites lit.') });

  } else {
    // A crisis inside the visor: world still + HUD + the timed interaction in the lower third.
    const idx = CONTENT.crises.findIndex(x => x.id === cur), c = CONTENT.crises[idx];
    main.innerHTML = `<div class="stage-wrap" id="frame"><div class="world"></div></div>
      <div class="row"><button class="btn" id="boot">Boot HUD (story order)</button><button class="btn" id="dead">HUD dead</button></div>
      <p class="note">HUD shows what earlier crises unlocked. Miss 3 times for the timer prompt. ?timer=off starts with it off.</p>`;
    const waypoints = CONTENT.salvageMap.beats.filter(b => b.salvage).map(b => ({ 'reflector-a11': 'APOLLO 11', 'rtg-a12': 'APOLLO 12', 'drill-im2': 'IM-2 DRILL', 'reflector-ch3': 'VIKRAM' }[b.salvage]));
    let active = null, misses = 0;
    const hud = mountHud($('#frame'), { waypoints, onTimer: on => { active?.setTimer?.(on); hud?.toast && ($('.visor-toast').hidden = true); } });
    const earned = [...CONTENT.opener.hudUnlock, ...CONTENT.crises.slice(0, idx).flatMap(x => x.hudUnlock)];
    hud.unlock(earned, false); hud.unlock(['objective'], false); hud.setObjective(c.objective);
    $('#boot').onclick = () => { $('#frame').querySelectorAll('[data-hud]').forEach(el => el.classList.add('off')); hud.unlock(['o2-gauge', ...CONTENT.crises.flatMap(x => x.hudUnlock).filter(k => k !== 'all')]); };
    $('#dead').onclick = () => $('#frame').querySelectorAll('[data-hud]').forEach(el => el.classList.toggle('off', el.dataset.hud !== 'o2-gauge'));
    const again = () => {
      active?.destroy();
      active = mountInteraction(hud.panel, c.interaction, {
        timerOn: hud.timer.on,
        onMiss: () => { hud.fail(); if (++misses === 3) hud.toast('Want to read at your own pace? Turn off the timer ↗'); log('misses ' + misses); },
        onWin: () => { hud.unlock(c.hudUnlock); log(`WIN → ${c.payoff.solvedBefore} · ${c.payoff.lines[0]}`); setTimeout(again, 3000); },
      });
    };
    again();
    window.__proto = { get misses() { return misses; } };
  }
</script>
</body>
</html>

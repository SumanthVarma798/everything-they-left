<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything They Left</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;800&family=Barlow+Condensed:wght@500;600;700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="lib/game.css">
<link rel="stylesheet" href="lib/era.css">
<script src="vendor/rough.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  html { scroll-snap-type: y proximity; scroll-behavior: smooth; scroll-padding-top: 56px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  #site-header {
    position: fixed; inset: 0 0 auto; z-index: 40; height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 20px; background: rgba(8, 12, 18, .88); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  #site-header .brand {
    font: 700 15px/1 var(--label); letter-spacing: .18em; color: var(--hi); text-decoration: none; white-space: nowrap;
  }
  #site-header .brand span { color: var(--accent2); margin-right: .4em; }
  #site-header nav { display: flex; gap: 18px; flex-wrap: wrap; }
  #site-header nav a {
    font: 600 13px/1 var(--label); letter-spacing: .16em; color: var(--dim); text-decoration: none;
  }
  #site-header nav a[aria-current="page"] { color: var(--accent2); }

  #story { position: relative; height: 300vh; }
  #crawl { position: absolute; top: 0; left: 0; right: 0; height: 200vh; pointer-events: none; }
  #play {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100vh;
    scroll-snap-align: center; scroll-snap-stop: always; pointer-events: none;
  }
  .sticky-stage {
    position: sticky; top: 56px; height: calc(100vh - 56px);
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    padding: 10px 16px 12px; box-sizing: border-box;
  }
  .stage-frame {
    position: relative; width: min(100%, calc((100vh - 56px - 58px) * 16 / 9));
    max-height: calc(100% - 48px); aspect-ratio: 16 / 9; margin: 0 auto;
    background: #000; overflow: hidden; flex: none;
  }
  .stage-frame canvas { width: 100%; height: 100%; display: block; }
  .still {
    position: absolute; inset: 0; z-index: 0;
    background: url('assets/img/watcher-earthset-limb.jpg') center / cover;
  }
  #hud-root { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .sticky-stage.is-play #hud-root { pointer-events: auto; }
  .sticky-stage:not(.is-play) #hud-root { opacity: 0; }
  #cut { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #cut > * { pointer-events: auto; }
  #dev { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
  .beat-name {
    position: absolute; bottom: 14%; left: 50%; translate: -50% 0;
    margin: 0; font: 13px var(--mono); color: var(--dim); letter-spacing: .08em;
  }

  #crawl-copy {
    position: absolute; inset: 8% 12% auto; z-index: 6; pointer-events: none;
    transform-origin: 50% 100%; color: var(--gold); text-align: center;
    font: 400 22px/1.45 var(--display);
  }
  #crawl-copy h1 { font: 800 42px/1 var(--display); letter-spacing: .08em; color: var(--hi); margin: 0 0 8px; }
  #crawl-copy .sub { font: 600 18px var(--label); letter-spacing: .28em; color: var(--accent2); margin: 0 0 22px; }
  #crawl-copy p { margin: 0 0 .7em; }
  .sticky-stage.is-play #crawl-copy { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #crawl-copy { transform: none !important; } }

  .stage-cta {
    position: absolute; z-index: 7; left: 50%; top: 50%; translate: -50% -50%;
    font: 700 18px/1 var(--label); letter-spacing: .16em; color: #002a22;
    background: var(--accent2); border: 0; border-radius: 8px; padding: 16px 22px; cursor: pointer;
  }
  #play-cta { animation: play-pulse 1.8s ease-in-out infinite; }
  @keyframes play-pulse {
    50% { transform: scale(1.04); box-shadow: 0 0 28px rgba(0, 255, 204, .5); }
  }
  @media (prefers-reduced-motion: reduce) { #play-cta { animation: none; } }
  .sticky-stage:not(.is-play) .stage-cta { display: none !important; }

  #checkpoint-chip {
    position: absolute; z-index: 8; top: 12%; left: 50%; translate: -50% 0;
    font: 700 13px var(--label); letter-spacing: .14em; color: var(--hi);
    background: rgba(10, 20, 26, .9); border: 1px solid var(--accent2); border-radius: 6px;
    padding: 8px 12px; white-space: nowrap; pointer-events: none;
  }
  #checkpoint-chip.show { animation: chip-flash 2s ease-out both; }
  @keyframes chip-flash {
    0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; }
  }

  .control-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px;
    font: 600 13px var(--label); letter-spacing: .1em;
  }
  .control-bar button {
    background: var(--bg3); border: 1px solid var(--border); color: var(--hi);
    border-radius: 6px; padding: 8px 12px; cursor: pointer;
  }
  .control-bar button[aria-pressed="true"] { border-color: var(--accent2); color: var(--accent2); }
  .pips { display: flex; gap: 6px; margin-left: 8px; }
  .pip {
    display: block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--dim);
    background: transparent; padding: 0;
  }
  .pip.on { background: var(--accent2); border-color: var(--accent2); }

  #dossier, #hangar { min-height: 100vh; padding: 72px 24px 48px; }
  #back-surface {
    font: 600 14px var(--label); letter-spacing: .12em; color: var(--accent2);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  #sources {
    padding: 48px 24px 80px; border-top: 1px solid var(--border); max-width: 720px; margin: 0 auto;
  }
  #sources h2 { font: 700 22px var(--label); letter-spacing: .16em; color: var(--hi); }
  #memorial { margin: 0 0 20px; padding: 0; list-style: none; color: var(--text); }
  #memorial li { margin: 0 0 .45em; font: 16px/1.45 var(--display); }
  #source-count { font: 13px var(--mono); color: var(--dim); }
  #sources .credits-link { color: var(--accent2); }
  #closing {
    margin: 28px 0 0; font: 600 italic 22px/1.4 var(--display); color: var(--hi);
  }

  body.debug [data-debug] { position: relative; }
  body.debug [data-debug]::after {
    content: attr(data-debug); position: absolute; left: 4px; top: 4px; z-index: 30;
    font: 10px/1 var(--mono); color: #8f8; background: rgba(0, 0, 0, .65);
    padding: 2px 4px; pointer-events: none; letter-spacing: .04em;
  }
</style>
</head>
<body>
<header id="site-header" data-debug="header">
  <a class="brand" href="#story"><span>⟡</span><b id="brand-title"></b></a>
  <nav>
    <a href="#play">STORY</a>
    <a href="#hangar">HANGAR</a>
    <a href="#dossier">ARCHIVE</a>
    <a href="#sources">SOURCES</a>
  </nav>
</header>

<div id="story" data-debug="story">
  <div class="sticky-stage" id="stage-root" data-debug="stage-root">
    <div class="stage-frame" id="stage-frame" data-debug="stage-frame">
      <canvas id="stage" data-debug="stage"></canvas>
      <div class="still" id="still" hidden data-debug="still"></div>
      <div id="hud-root" data-debug="hud"></div>
      <div id="cut" data-debug="cut"></div>
      <div id="dev" hidden data-debug="dev"></div>
      <div id="crawl-copy" data-debug="crawl-copy"></div>
      <button type="button" class="stage-cta" id="play-cta" hidden>▶ PLAY AS BHOOMI</button>
      <button type="button" class="stage-cta" id="continue-cta" hidden>▶ CONTINUE</button>
      <div id="checkpoint-chip" hidden></div>
    </div>
    <div class="control-bar" id="controls" hidden data-debug="controls">
      <button type="button" id="btn-pause">⏸ PAUSE</button>
      <button type="button" id="btn-checkpoint">⟲ CHECKPOINT</button>
      <button type="button" id="btn-skip">⏭ SKIP</button>
      <button type="button" id="btn-timer" aria-pressed="true">⏱ ON</button>
      <div class="pips" id="pips"></div>
    </div>
  </div>
  <div id="crawl" data-debug="crawl"></div>
  <section id="play" data-debug="play" aria-label="Play"></section>
</div>

<section id="dossier" data-debug="dossier">
  <button type="button" id="back-surface">↑ Back to the surface</button>
  <div id="dossier-root"></div>
</section>
<section id="hangar" data-debug="hangar">
  <div id="hangar-root"></div>
</section>
<footer id="sources" data-debug="sources">
  <h2>Memorial</h2>
  <ul id="memorial"></ul>
  <p id="source-count"></p>
  <p><a class="credits-link" href="CREDITS.md">Credits</a></p>
  <p id="closing"></p>
</footer>

<script type="module">
  import { CONTENT } from './content.js';
  import { boot } from './lib/engine.js';

  const Q = new URLSearchParams(location.search);
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const WP0 = CONTENT.crises[0].waypoint;

  document.title = CONTENT.title;
  $('#brand-title').textContent = CONTENT.title;

  const crawlCopy = $('#crawl-copy');
  const h = document.createElement('h1'); h.textContent = CONTENT.title; crawlCopy.append(h);
  const sub = document.createElement('p'); sub.className = 'sub'; sub.textContent = CONTENT.subtitle; crawlCopy.append(sub);
  CONTENT.prologue.lines.forEach(line => { const p = document.createElement('p'); p.textContent = line; crawlCopy.append(p); });

  CONTENT.memorial.forEach(line => { const li = document.createElement('li'); li.textContent = line; $('#memorial').append(li); });
  const urls = new Set();
  const addSrc = srcs => (srcs || []).forEach(([, u]) => u && urls.add(u));
  addSrc(CONTENT.opener.sources); addSrc(CONTENT.notebook.sources); addSrc(CONTENT.finale.sources);
  CONTENT.crises.forEach(c => addSrc(c.sources));
  $('#source-count').textContent = `${urls.size} sources`;
  $('#closing').textContent = CONTENT.finale.closing;

  const pips = $('#pips');
  CONTENT.crises.forEach(c => {
    const b = document.createElement('i');
    b.className = 'pip'; b.title = `${c.chapter}. ${c.title}`; b.setAttribute('aria-label', c.name);
    pips.append(b);
  });

  const game = boot({
    canvas: $('#stage'),
    hudRoot: $('#hud-root'),
    cut: $('#cut'),
    still: $('#still'),
  });

  const syncTimer = on => {
    $('#btn-timer').setAttribute('aria-pressed', String(on));
    $('#btn-timer').textContent = on ? '⏱ ON' : '⏱ OFF';
  };
  syncTimer(game.hud.timer.on);
  game.onTimer(syncTimer);
  $('#btn-timer').addEventListener('click', () => game.hud.timer.set(!game.hud.timer.on));

  const updatePips = () => {
    const id = game.state.chapter;
    const idx = CONTENT.crises.findIndex(c => c.id === id);
    [...pips.children].forEach((el, i) => el.classList.toggle('on', game.state.started && idx >= 0 && i <= idx));
  };

  const chip = $('#checkpoint-chip');
  game.onCheckpoint(({ chapter, title }) => {
    chip.textContent = `CHECKPOINT SET · Ch ${chapter} · ${title}`;
    chip.hidden = false;
    chip.classList.remove('show');
    void chip.offsetWidth;
    chip.classList.add('show');
    updatePips();
  });
  chip.addEventListener('animationend', () => { chip.classList.remove('show'); chip.hidden = true; });

  const showContinue = () => {
    if (!game.state.started) return;
    const s = game.state;
    $('#continue-cta').textContent = `▶ CONTINUE · Ch ${s.chapterNum} · ${s.title}`;
    $('#continue-cta').hidden = false;
    $('#play-cta').hidden = true;
  };
  const hideContinue = () => { $('#continue-cta').hidden = true; };

  $('#play-cta').addEventListener('click', () => {
    $('#play-cta').hidden = true;
    hideContinue();
    game.start();
    updatePips();
    $('#controls').hidden = false;
  });
  $('#continue-cta').addEventListener('click', () => { hideContinue(); game.resume(); });
  $('#btn-pause').addEventListener('click', () => { if (!game.state.started) return; game.pause(); showContinue(); });
  $('#btn-checkpoint').addEventListener('click', () => game.replayCheckpoint());
  $('#btn-skip').addEventListener('click', () => game.skip());
  $('#back-surface').addEventListener('click', () => $('#play').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }));

  let dirty = true;
  addEventListener('scroll', () => { dirty = true; }, { passive: true });
  addEventListener('resize', () => { dirty = true; }, { passive: true });

  const crawl = $('#crawl');
  const root = $('#stage-root');
  const still = $('#still');
  function loop() {
    requestAnimationFrame(loop);
    if (!dirty) return;
    dirty = false;
    const crawlH = crawl.offsetHeight;
    const t = reduce ? 1 : Math.min(1, Math.max(0, scrollY / Math.max(1, crawlH - innerHeight)));
    if (reduce) {
      crawlCopy.style.transform = 'none';
      crawlCopy.style.opacity = '0';
    } else {
      crawlCopy.style.transform = `perspective(420px) rotateX(24deg) translateY(calc(100% - ${t * 190}%))`;
      crawlCopy.style.opacity = t > 0.85 ? String(Math.max(0, 1 - (t - 0.85) / 0.15)) : '1';
    }
    const playing = t >= 1;
    root.classList.toggle('is-play', playing);
    if (playing && !game.state.started) $('#play-cta').hidden = false;
    if (!playing) {
      $('#play-cta').hidden = true;
      $('#controls').hidden = true;
      if (game.state.started && !game.state.paused) { game.pause(); leftPlay = true; }
    } else if (game.state.started) {
      $('#controls').hidden = false;
      if (leftPlay) showContinue();
    }

    if (!game.state.started) {
      const wp = reduce ? WP0 : {
        lat: lerp(-20, -89.67, t),
        lon: lerp(300, 129.78, t),
        alt: lerp(4.4, 1.6, t),
        sunLon: 90,
      };
      if (game.stage) game.stage.snap(wp);
      else still.style.transform = `translateY(${t * -8}%)`;
    }
  }
  dirty = true;
  requestAnimationFrame(loop);

  let leftPlay = false;
  new IntersectionObserver(([e]) => {
    if (e.intersectionRatio < 0.6) {
      game.pause();
      leftPlay = true;
    } else if (leftPlay && game.state.started) {
      showContinue();
    }
  }, { threshold: [0, 0.6] }).observe($('#stage-frame'));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { game.pause(); if (game.state.started) leftPlay = true; }
    else if (leftPlay && game.state.started) showContinue();
  });

  const navFor = { play: $('a[href="#play"]'), dossier: $('a[href="#dossier"]'), hangar: $('a[href="#hangar"]'), sources: $('a[href="#sources"]') };
  const navObs = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!vis) return;
    Object.values(navFor).forEach(a => a.removeAttribute('aria-current'));
    navFor[vis.target.id]?.setAttribute('aria-current', 'page');
  }, { threshold: [0.35, 0.6], rootMargin: '-56px 0px 0px 0px' });
  ['play', 'dossier', 'hangar', 'sources'].forEach(id => navObs.observe($('#' + id)));

  if (Q.get('screen') || Q.get('c')) {
    location.hash = '#play';
    $('#play').scrollIntoView({ behavior: 'auto' });
  }

  if (Q.get('debug') === '1') {
    document.body.classList.add('debug');
    $('#dev').hidden = false;
  }

  try {
    const { mountDossier, mountHangar } = await import('./lib/hangar.js');
    mountDossier?.($('#dossier-root'), { onBack: () => $('#play').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }) });
    mountHangar?.($('#hangar-root'), {});
  } catch { /* hangar not merged yet */ }
</script>
</body>
</html>
